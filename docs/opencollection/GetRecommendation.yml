info:
  name: GetRecommendation
  type: http
  seq: 21

http:
  method: GET
  url: "{{server_url}}/recommendations/:id"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: id
      value: b1031c0c-2367-400b-9eb5-79cf9bca423e
      type: path
      description: recommendation ID in UUID format
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Success
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "id": "0195d1e2-3f4a-7b5c-8d6e-9f0a1b2c3d40",
            "position_id": "0194bf5a-1d2e-7c3b-9a4f-5e6d7c8b9a10",
            "candidate_id": "0199c0a3-7c1b-7d5e-9f2a-3b6c8d1e4f7a"
          }
  - name: Recommendation not found
    response:
      status: 404
      statusText: Not Found
      body:
        type: json
        data: |-
          {
            "type": "urn:hirevec:recommendation-not-found",
            "detail": "Recommendation not found",
            "source": {
              "parameter": "id"
            }
          }
