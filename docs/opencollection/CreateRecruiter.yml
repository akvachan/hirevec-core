info:
  name: CreateRecruiter
  type: http
  seq: 8

http:
  method: POST
  url: "{{server_url}}/recruiters"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  auth: inherit

examples:
  - name: Success
    response:
      status: 201
      statusText: "Created"
      headers:
        - name: Cache-Control
          value: "no-store"
      body:
        type: json
        data: |-
          {
            "access_token": "v4.public.eyJhdWQiOiJoaXJldmVjLmNvbSIsImV4cCI6IjIwMjYtMTAtMDRUMTA6NDM6NThaIiwiaXNzIjoiaGlyZXZlYy5jb20iLCJwcm92aWRlciI6ImVtYWlsIiwic2NvcGUiOiJyb2xlOmNhbmRpZGF0ZSIsInN1YiI6IjAxOTljMGEzLTdjMWItN2Q1ZS05ZjJhLTNiNmM4ZDFlNGY3YSJ9",
            "token_type": "Bearer",
            "expires_in": 1800,
            "scope": "role:candidate",
            "user_id": "0199c0a3-7c1b-7d5e-9f2a-3b6c8d1e4f7a"
          }
  - name: Recruiter already exists
    response:
      status: 409
      statusText: "Conflict"
      body:
        type: json
        data: |-
          {
            "type": "urn:hirevec:recruiter-exists",
            "detail": "Recruiter already exists",
            "source": {
              "pointer": "user_id"
            }
          }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
