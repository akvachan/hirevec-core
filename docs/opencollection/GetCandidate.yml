info:
  name: GetCandidate
  type: http
  seq: 12

http:
  method: GET
  url: "{{server_url}}/candidates/:id"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: id
      value: me
      type: path
      description: candidate ID in UUID format or "me"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Success
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "id": "0199c0a3-7c1b-7d5e-9f2a-3b6c8d1e4f7a",
            "user_id": "0199c0a3-7c1b-7d5e-9f2a-3b6c8d1e4f7a",
            "about": "Backend engineer passionate about distributed systems and databases.",
            "pref_remote": true,
            "pref_title_1": "Backend Engineer",
            "pref_title_2": "Software Engineer",
            "pref_location_1_id": 1,
            "pref_location_2_id": 2,
            "last_recommended_at": "2026-10-25T00:00:00Z",
            "experiences": [{
              "id": "0199c6d1-2f9a-7b3c-8e4d-5a6f1b2c3d40",
              "candidate_id": "0199c0a3-7c1b-7d5e-9f2a-3b6c8d1e4f7a",
              "title": "Backend Engineer",
              "started_at": "2021-06-01T00:00:00Z",
              "ended_at": "2024-01-01T00:00:00Z",
              "description": "Built ingestion pipelines and internal tooling.",
              "company": "Example Corp",
              "experience_type": "work",
              "skill_1": "Go",
              "skill_2": "PostgreSQL",
            }]
          }
  - name: Candidate not found
    response:
      status: 404
      statusText: Not Found
      body:
        type: json
        data: |-
          {
            "type": "urn:hirevec:candidate-not-found",
            "detail": "Candidate not found",
            "source": {
              "parameter": "id"
            }
          }
