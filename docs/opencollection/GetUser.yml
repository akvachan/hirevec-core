info:
  name: GetUser
  type: http
  seq: 5

http:
  method: GET
  url: "{{server_url}}/users/:id"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: id
      value: me
      type: path
      description: user ID in UUID format or "me"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Success
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "id": "0199c0a3-7c1b-7d5e-9f2a-3b6c8d1e4f7a",
            "email": "alex.chen.demo@example.com",
            "full_name": "Alex Chen",
            "user_name": "clever_foxa1b2c3d4",
            "updated_at": "2026-10-25T10:00:00Z"
          }
  - name: Forbidden
    response:
      status: 403
      statusText: Forbidden
      body:
        type: json
        data: |-
          {
            "type": "urn:hirevec:forbidden",
            "detail": "You do not have access to this resource"
          }
