info:
  name: GetReactions
  type: http
  seq: 23

http:
  method: GET
  url: "{{server_url}}/reactions?role=candidate&limit=32"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: role
      value: candidate
      type: query
      description: role filter, can be "candidate" or "recruiter"
    - name: limit
      value: "32"
      type: query
      description: page limit, 32 by default, maximum page size is 128
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Success
    response:
      status: 200
      statusText: OK
      headers:
        - name: Link
          value: <localhost:8888/reactions?cursor=0195d1e2-3f4a-7b5c-8d6e-9f0a1b2c3d40&limit=32>; rel="next"
      body:
        type: json
        data: |-
          [
            {
              "recommendation_id": "0195d1e2-3f4a-7b5c-8d6e-9f0a1b2c3d40",
              "reaction_type": "positive",
              "reacted_at": "2026-10-25T09:00:00Z"
            }
          ]
  - name: Missing required role
    response:
      status: 403
      statusText: Forbidden
      body:
        type: json
        data: |-
          {
            "type": "urn:hirevec:missing-required-role",
            "detail": "Missing one of required roles: recruiter, candidate"
          }
