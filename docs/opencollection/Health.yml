info:
  name: Health
  type: http
  seq: 1

http:
  method: GET
  url: "{{server_url}}/health"
  auth: inherit

examples:
  - name: Success
    response:
      status: 200
      statusText: "OK"
      body:
        type: json
        data: |-
          {"status": "ok"}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
