info:
  name: GetMatches
  type: http
  seq: 24

http:
  method: GET
  url: "{{server_url}}/matches?role=candidate&limit=32"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: role
      value: candidate
      type: query
      description: role filter, can be "candidate" or "recruiter"
    - name: limit
      value: "32"
      type: query
      description: page limit, 32 by default, maximum page size is 128
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Success
    response:
      status: 200
      statusText: OK
      headers:
        - name: Link
          value: <localhost:8888/matches?cursor=0195d1e2-3f4a-7b5c-8d6e-9f0a1b2c3d40&limit=32>; rel="next"
      body:
        type: json
        data: |-
          [
            {
              "position_id": "0194bf5a-1d2e-7c3b-9a4f-5e6d7c8b9a10",
              "position_title": "Backend Engineer",
              "position_company": "Example Corp",
              "recruiter_id": "018f6b1a-2c4e-7a3b-8d5f-9e6b2a1c3d40",
              "recruiter_full_name": "Jane Smith",
              "matched_at": "2026-10-25T09:30:00Z"
            }
          ]
  - name: Missing required role
    response:
      status: 403
      statusText: Forbidden
      body:
        type: json
        data: |-
          {
            "type": "urn:hirevec:missing-required-role",
            "detail": "Missing one of required roles: recruiter, candidate"
          }
