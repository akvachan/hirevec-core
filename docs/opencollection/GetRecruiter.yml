info:
  name: GetRecruiter
  type: http
  seq: 9

http:
  method: GET
  url: "{{server_url}}/recruiters/:id"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: id
      value: me
      type: path
      description: recruiter ID in UUID format or "me"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Success
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "id": "018f6b1a-2c4e-7a3b-8d5f-9e6b2a1c3d40",
            "user_id": "0199c0a3-7c1b-7d5e-9f2a-3b6c8d1e4f7a"
          }
  - name: Recruiter not found
    response:
      status: 404
      statusText: Not Found
      body:
        type: json
        data: |-
          {
            "type": "urn:hirevec:recruiter-not-found",
            "detail": "Recruiter not found",
            "source": {
              "parameter": "id"
            }
          }
